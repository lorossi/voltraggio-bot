[build-system]
requires = ["uv_build>=0.13.5,<0.14"]
build-backend = "uv_build"


[project]
name = "voltraggio-bot"
version = "2.0.0"
description = "LE PAROLE SONO IMPORTANTI! A Telegram bot that corrects anyone who says voltaggio."
requires-python = ">=3.13"
readme = "README.md"
license = "CC-BY-NC-4.0"
dependencies = ["python-telegram-bot==22.5"]

[project.scripts]
voltraggio-bot = "voltraggio_bot.main:run"

[project.urls]
"Homepage" = "https://github.com/lorossi/voltraggio-bot"
"Repository" = "https://github.com/lorossi/voltraggio-bot"

[dependency-groups]
dev = ["ruff==0.17.2", "ty==0.0.92", { include-group = "test" }]
test = ["pytest==9.0.2", "pytest-asyncio==1.3.0", "pytest-cov==7.0.0"]

[tool.uv]
default-groups = ["dev"]

[tool.uv.build-backend]
module-root = ""

[tool.ruff]
line-length = 88
target-version = "py313"

[tool.ruff.lint]
preview = true # needed for "DOC" rules
select = ["ALL"]
ignore = [
  "ANN401",  # allow "Any" type
  "COM812",  # conflicts with the formatter
  "CPY001",  # no copyright header in every file
  "N802",    # the project uses camelCase method names
  "RUF001",  # italian strings contain "à", "è" and the like
  "RUF201",  # rule codes are kept in the selectors
]
unfixable = ["F401"] # do not fix unused imports

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
  "S101",    # tests use assert
  "ASYNC240", # blocking file reads are fine in tests
  "PLR2004", # magic values are fine in tests
  "PLC2701", # tests access private members
  "SLF001",
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.environment]
python-version = "3.13"

[tool.ty.terminal]
error-on-warning = true

[tool.ty.rules]
possibly-missing-attribute = "error"
possibly-missing-import = "error"
possibly-unresolved-reference = "error"
redundant-cast = "error"
unused-ignore-comment = "error"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["voltraggio_bot"]
omit = ["tests/**", "**/__init__.py", "**/main.py"]
